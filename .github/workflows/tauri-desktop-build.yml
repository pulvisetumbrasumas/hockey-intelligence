name: tauri-desktop-build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install JS deps
        run: npm ci

      - name: Build Windows installer (NSIS + MSI)
        run: npm run tauri:build -- --bundles nsis,msi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hockey-intelligence-windows-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install JS deps
        run: npm ci

      - name: Install Tauri Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf

      - name: "Build AppImage (skip strip: old linuxdeploy strip breaks on .relr.dyn)"
        env:
          NO_STRIP: "1"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npm run tauri:build -- --bundles appimage

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hockey-intelligence-linux-appimage
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error