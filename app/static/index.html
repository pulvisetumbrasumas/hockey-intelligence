<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hockey Intelligence</title>
<style>
  :root {
    --bg: #0f1420; --panel: #1a2233; --panel2: #222d42; --line: #2e3a55;
    --text: #e8edf6; --muted: #9aa7be; --accent: #4cc2ff; --gold: #f2c14e;
    --good: #57d9a3; --bad: #ff7b7b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
         background: var(--bg); color: var(--text); }
  header { display: flex; align-items: center; gap: 16px; padding: 14px 20px;
           background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; }
  header h1 span { color: var(--accent); }
  nav { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; }
  nav button { background: transparent; color: var(--muted); border: 1px solid transparent;
               padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 14px; }
  nav button.active { color: var(--text); background: var(--panel2); border-color: var(--line); }
  main { max-width: 1080px; margin: 0 auto; padding: 20px; }
  section.tab { display: none; }
  section.tab.active { display: block; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
          padding: 18px; margin-bottom: 16px; }
  .card h2 { margin: 0 0 12px; font-size: 16px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  input, select, button, textarea { font: inherit; color: var(--text);
        background: var(--panel2); border: 1px solid var(--line); border-radius: 8px;
        padding: 9px 12px; }
  button.primary { background: var(--accent); color: #06222f; font-weight: 600;
        border-color: var(--accent); cursor: pointer; }
  button.primary:disabled { opacity: .5; cursor: wait; }
  label { color: var(--muted); font-size: 13px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: right; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; }
  th:first-child, td:first-child { text-align: left; }
  .muted { color: var(--muted); }
  .gold { color: var(--gold); }
  #spinner { display: none; color: var(--muted); }
  .bars { display: flex; align-items: flex-end; gap: 4px; height: 90px; margin-top: 10px; }
  .bar { flex: 1; background: var(--accent); border-radius: 3px 3px 0 0; min-width: 6px;
         position: relative; opacity: .85; }
  .bar-label { position: absolute; color: var(--muted); font-size: 10px; bottom: -16px;
         left: 50%; transform: translateX(-50%); white-space: nowrap; }
  .error { color: var(--bad); }
  .chat-log { display: flex; flex-direction: column; gap: 10px; max-height: 420px;
         overflow-y: auto; }
  .msg { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px;
         padding: 12px; white-space: pre-wrap; }
  .msg.user { border-color: var(--accent); }
  .msg .tag { color: var(--muted); font-size: 12px; margin-bottom: 4px; }
  .ev { color: var(--muted); font-size: 12px; margin-top: 8px; }
  .pill { display: inline-block; background: var(--panel2); border: 1px solid var(--line);
         border-radius: 20px; padding: 2px 10px; font-size: 12px; margin: 2px 4px 2px 0; }
</style>
</head>
<body>
<header>
  <h1><span>Hockey</span> Intelligence</h1>
  <nav>
    <button data-tab="player" class="active">Player</button>
    <button data-tab="leaders">Leaders</button>
    <button data-tab="compare">Compare</button>
    <button data-tab="ai">Ask AI</button>
  </nav>
</header>

<main>
  <!-- PLAYER -->
  <section id="tab-player" class="tab active">
    <div class="card">
      <h2>Find a player</h2>
      <div class="row">
        <input id="psearch" placeholder="Name, e.g. McDavid" style="flex:1" autocomplete="off">
        <button class="primary" id="psearchBtn">Search</button>
      </div>
      <div id="presults" class="row" style="margin-top:12px"></div>
    </div>
    <div id="pprofile" class="card" style="display:none">
      <h2 id="pname"></h2>
      <div id="pbio" class="muted"></div>
      <div id="pcareer" style="margin-top:14px"></div>
      <div id="pbars"></div>
      <h3 style="margin:16px 0 6px; font-size:14px; color:var(--muted)">By season</h3>
      <div id="pseasons"></div>
    </div>
  </section>

  <!-- LEADERS -->
  <section id="tab-leaders" class="tab">
    <div class="card">
      <h2>League leaders</h2>
      <div class="row">
        <label>Scope
          <select id="lscope">
            <option value="20242025">2024-25</option>
            <option value="20152016">2015-16</option>
            <option value="career">All-time career</option>
          </select>
        </label>
        <label>Position
          <select id="ltype"><option value="skater">Skaters</option><option value="goalie">Goalies</option></select>
        </label>
        <label>Stat
          <select id="lstat">
            <optgroup label="Skater">
              <option value="points">Points</option>
              <option value="goals">Goals</option>
              <option value="assists">Assists</option>
              <option value="points_per_game">Points per game</option>
              <option value="plus_minus">Plus/minus</option>
              <option value="game_winning_goals">Game-winning goals</option>
              <option value="power_play_goals">Power-play goals</option>
              <option value="shots">Shots</option>
              <option value="hits">Hits</option>
              <option value="blocked_shots">Blocked shots</option>
            </optgroup>
            <optgroup label="Goalie">
              <option value="wins">Wins</option>
              <option value="shutouts">Shutouts</option>
              <option value="save_pct">Save %</option>
              <option value="goals_against_average">Goals-against avg</option>
            </optgroup>
          </select>
        </label>
        <label>Limit
          <select id="llimit"><option>10</option><option>20</option><option>50</option></select>
        </label>
        <button class="primary" id="lgo">Load</button>
      </div>
      <div id="lresults" style="margin-top:14px"></div>
    </div>
  </section>

  <!-- COMPARE -->
  <section id="tab-compare" class="tab">
    <div class="card">
      <h2>Compare players</h2>
      <div class="row">
        <input id="cnames" placeholder="Names, comma-separated (2-5), e.g. Connor McDavid, Nathan MacKinnon"
               style="flex:1" autocomplete="off">
        <button class="primary" id="cgo">Compare</button>
      </div>
      <div id="cmp" style="margin-top:14px"></div>
    </div>
  </section>

  <!-- AI -->
  <section id="tab-ai" class="tab">
    <div class="card">
      <h2>Ask the database-grounded assistant</h2>
      <div id="chat" class="chat-log"></div>
      <div class="row" style="margin-top:12px">
        <textarea id="q" rows="2" style="flex:1"
          placeholder="e.g. Who scored the most points in 2024-25, and how did McDavid's PPG compare to Kucherov's?"
        ></textarea>
        <button class="primary" id="qbtn">Ask</button>
      </div>
      <div id="qi" class="muted" style="margin-top:8px">The model runs locally; a grounded answer may take 1-3 minutes on this machine.</div>
    </div>
  </section>
</main>

<script>
const $ = (s) => document.querySelector(s);
const api = async (url, opts) => {
  const r = await fetch(url, opts);
  if (!r.ok) {
    let d; try { d = await r.json(); } catch { d = {}; }
    throw new Error(d.detail || d.error || ("HTTP " + r.status));
  }
  return r.json();
};

document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  document.querySelectorAll("nav button").forEach(x => x.classList.remove("active"));
  document.querySelectorAll("section.tab").forEach(x => x.classList.remove("active"));
  b.classList.add("active");
  $("#tab-" + b.dataset.tab).classList.add("active");
});

/* ---------- Player tab ---------- */
function renderSearch(matches) {
  const el = $("#presults"); el.innerHTML = "";
  if (!matches.length) { el.innerHTML = '<span class="error">No players found.</span>'; return; }
  matches.slice(0, 12).forEach(p => {
    const b = document.createElement("button");
    b.className = "pill";
    b.textContent = `${p.full_name} · ${p.position || "?"}${p.active ? "" : " (retired)"}`;
    b.onclick = () => loadProfile(p.player_id);
    el.appendChild(b);
  });
}

async function loadProfile(id) {
  const box = $("#pprofile"); box.style.display = "block";
  $("#pcareer").innerHTML = '<span class="muted" id="spinner" style="display:inline">Loading stats…</span>';
  $("#spinner").style.display = "inline";
  try {
    const [profile, career, seasons] = await Promise.all([
      api(`/api/players/${id}`), api(`/api/players/${id}/career`), api(`/api/players/${id}/seasons`),
    ]);
    $("#pname").textContent = profile.full_name || `Player #${id}`;
    const bio = [profile.position, profile.height, profile.weight && profile.weight + " lbs",
      [profile.birth_city, profile.birth_country].filter(Boolean).join(", ") || null,
      profile.shoots_catches && "Shoots " + profile.shoots_catches,
      profile.birth_date].filter(Boolean).join(" · ");
    $("#pbio").textContent = bio;
    $("#pcareer").innerHTML = renderCareer(career);
    renderBars(seasons.seasons || []);
    renderSeasons(seasons.seasons || []);
  } catch (e) {
    $("#pcareer").innerHTML = `<span class="error">${e.message}</span>`;
  } finally { $("#spinner").style.display = "none"; }
}

function renderCareer(c) {
  const rs = c.regular_season || {};
  if (!Object.keys(rs).length)
    return '<span class="muted">No regular-season statistics in the database.</span>';
  const g = c.regular_season_goalie || {};
  const pl = c.playoffs || {};
  const rows = [];
  const f = (k, v) => `<tr><td>${k}</td><td>${v ?? "—"}</td></tr>`;
  if (g.wins != null) {
    rows.push(f("Games (G)", g.games_played), f("Wins", g.wins), f("Losses", g.losses),
      f("Shutouts", g.shutouts), f("Save %", g.save_pct), f("GAA", g.goals_against_average),
      f("Seasons", g.seasons_played));
  } else {
    rows.push(f("Games", rs.games_played), f("Goals", rs.goals), f("Assists", rs.assists),
      f("Points", rs.points), f("Pts/Game", rs.points_per_game), f("+/-", rs.plus_minus),
      f("GWG", rs.game_winning_goals), f("Shots", rs.shots), f("Seasons", rs.seasons_played));
  }
  if (pl.games_played) rows.push(f("Playoffs GP", pl.games_played),
    f("Playoffs Pts", pl.points ?? "—"), f("Playoff Pts/Game", pl.points_per_game ?? "—"));
  return `<table><tbody>${rows.join("")}</tbody></table>`;
}

function renderBars(seasons) {
  const el = $("#pbars"); el.innerHTML = "";
  const rs = seasons.filter(s => s.points != null);
  if (!rs.length) return;
  const max = Math.max(...rs.map(s => s.points));
  const div = document.createElement("div");
  div.className = "bars";
  rs.forEach(s => {
    const bar = document.createElement("div");
    bar.className = "bar";
    bar.title = `${String(s.season_id).slice(0,4)}-${String(s.season_id).slice(6)} · ${s.points} pts`;
    bar.style.height = (s.points / max * 100) + "%";
    const lbl = document.createElement("div");
    lbl.className = "bar-label";
    lbl.textContent = String(s.season_id).slice(0, 4);
    bar.appendChild(lbl);
    div.appendChild(bar);
  });
  el.appendChild(div);
}

function renderSeasons(seasons) {
  if (!seasons.length) { $("#pseasons").innerHTML = '<span class="muted">No season data.</span>'; return; }
  const head = "<tr><th>Season</th><th>Team</th><th>GP</th><th>G</th><th>A</th><th>Pts</th><th>+/-</th><th>PPG</th></tr>";
  const body = seasons.map(s => `<tr>
      <td>${String(s.season_id).slice(0,4)}-${String(s.season_id).slice(6)}</td>
      <td>${s.team || ""}</td><td>${s.games_played ?? ""}</td><td>${s.goals ?? ""}</td>
      <td>${s.assists ?? ""}</td><td>${s.points ?? ""}</td><td>${s.plus_minus ?? ""}</td>
      <td>${s.points_per_game ?? ""}</td></tr>`).join("");
  $("#pseasons").innerHTML = `<table><thead>${head}</thead><tbody>${body}</tbody></table>`;
}

$("#psearch").addEventListener("keydown", e => { if (e.key === "Enter") doSearch(); });
$("#psearchBtn").onclick = doSearch;
async function doSearch() {
  const q = $("#psearch").value.trim();
  if (!q) return;
  try { renderSearch((await api(`/api/search?q=${encodeURIComponent(q)}`)).matches || []); }
  catch (e) { $("#presults").innerHTML = `<span class="error">${e.message}</span>`; }
}

/* ---------- Leaders tab ---------- */
$("#lgo").onclick = loadLeaders;
async function loadLeaders() {
  const scope = $("#lscope").value;
  const type = $("#ltype").value;
  const stat = $("#lstat").value;
  const limit = $("#llimit").value;
  const url = scope === "career"
    ? `/api/stats/leaders/career?metric=${stat}&stat_type=${type}&limit=${limit}`
    : `/api/stats/leaders/season/${scope}?metric=${stat}&stat_type=${type}&limit=${limit}`;
  const el = $("#lresults"); el.innerHTML = '<span class="muted">Loading…</span>';
  try {
    const d = await api(url);
    if (!d.results.length) { el.innerHTML = '<span class="muted">No results.</span>'; return; }
    const head = `<tr><th>Rank</th><th>Player</th><th>Team</th><th>Pos</th><th>${d.metric.replace(/_/g, " ")}</th></tr>`;
    const body = d.results.map(r => `<tr>
        <td>${r.rank}</td><td><a href="#" onclick="loadPlayerFromLeaders(${r.player_id}); return false;">${r.name}</a></td>
        <td>${r.team || ""}</td><td>${r.position || ""}</td><td>${r.value}</td></tr>`).join("");
    el.innerHTML = `<div class="muted" style="margin-bottom:8px">${d.scope === "career" ? "All-time" : "Season"} ·
        ${d.stat_type} · ${d.metric}</div>
        <table><thead>${head}</thead><tbody>${body}</tbody></table>`;
  } catch (e) { el.innerHTML = `<span class="error">${e.message}</span>`; }
}
function loadPlayerFromLeaders(id) {
  document.querySelectorAll("nav button").forEach(x => x.classList.toggle("active", x.dataset.tab === "player"));
  document.querySelectorAll("section.tab").forEach(x => x.classList.toggle("active", x.id === "tab-player"));
  $("#psearch").value = "";
  loadProfile(id);
}

/* ---------- Compare tab ---------- */
$("#cgo").onclick = doCompare;
$("#cnames").addEventListener("keydown", e => { if (e.key === "Enter") doCompare(); });
async function doCompare() {
  const names = $("#cnames").value.split(",").map(s => s.trim()).filter(Boolean);
  const el = $("#cmp");
  if (names.length < 2 || names.length > 5) { el.innerHTML = '<span class="error">Enter 2-5 names.</span>'; return; }
  el.innerHTML = '<span class="muted">Resolving names…</span>';
  try {
    const ids = [];
    for (const n of names) {
      const s = await api(`/api/search?q=${encodeURIComponent(n)}`);
      const match = (s.matches || []).find(m => (m.full_name || "").toLowerCase() === n.toLowerCase()) || (s.matches || [])[0];
      if (!match) throw new Error(`No match for "${n}".`);
      ids.push(match.player_id);
    }
    const q = ids.map(i => `player_ids=${i}`).join("&");
    const d = await api(`/api/compare/players?${q}`, { method: "POST" });
    renderCompare(d);
  } catch (e) { el.innerHTML = `<span class="error">${e.message}</span>`; }
}
function renderCompare(d) {
  const rows = ["games_played","goals","assists","points","points_per_game","plus_minus","seasons_played"]
    .map(k => `<tr><td>${k.replace(/_/g, " ")}</td>` +
      d.players.map(pv => `<td>${pv[k] ?? "—"}</td>`).join("") + "</tr>").join("");
  const names = d.players.map(pv => `<th>${pv.name}</th>`).join("");
  let html = `<table><thead><tr><th></th>${names}</tr></thead><tbody>${rows}</tbody></table>`;
  html += '<div style="margin-top:14px"><h3 style="font-size:14px;color:var(--muted)">Evidence notes</h3>';
  for (const [dim, ev] of Object.entries(d.evidence || {})) {
    const cv = (ev.metric || []).map(m =>
      `<div class="ev"><b>${m.replace(/_/g, " ")}:</b> ` + d.players.map(pv =>
        `${pv.name}: ${ev.values?.[m]?.[pv.player_id] ?? "—"}`).join(" · ") + `</div>`).join("");
    html += `<div style="margin-top:8px"><b class="gold">${dim.replace(/_/g, " ")}</b>
      <div class="muted" style="font-size:13px">${ev.interpretation || ""}</div>${cv}</div>`;
  }
  html += '</div>';
  if (d.notes?.length) html += `<div class="muted" style="margin-top:8px">${d.notes.join(" ")}</div>`;
  $("#cmp").innerHTML = html;
}

/* ---------- AI tab ---------- */
$("#qbtn").onclick = askAI;
$("#q").addEventListener("keydown", e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) askAI(); });
function pushMsg(role, text) {
  const m = document.createElement("div");
  m.className = "msg " + role;
  m.innerHTML = `<div class="tag">${role === "user" ? "You" : "Assistant"}</div>${text}`;
  $("#chat").appendChild(m);
  $("#chat").scrollTop = $("#chat").scrollHeight;
  return m;
}
async function askAI() {
  const q = $("#q").value.trim();
  if (!q) return;
  pushMsg("user", q.replace(/</g, "&lt;"));
  $("#q").value = "";
  $("#qbtn").disabled = true;
  const status = pushMsg("bot", '<span class="muted">Reasoning with the local model… this can take a minute or two.</span>');
  try {
    const d = await api("/api/ai/ask", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: q }),
    });
    status.innerHTML = `<div class="tag">Assistant</div>${d.answer.replace(/</g, "&lt;")}`;
    if (d.provenance?.length) {
      const ev = document.createElement("div");
      ev.className = "ev";
      ev.textContent = "Grounded in: " + d.provenance.map(p => p.tool || p.result || JSON.stringify(p)).join(" · ");
      status.appendChild(ev);
    }
  } catch (e) {
    status.innerHTML = `<div class="tag">Assistant</div><span class="error">${e.message}</span>`;
  } finally { $("#qbtn").disabled = false; }
}

/* ---------- boot ---------- */
loadLeaders();
</script>
</body>
</html>
