<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="dark" />
<title>Hockey Intelligence</title>
<meta name="description" content="Open-source NHL hockey intelligence platform — premium, cinematic, data-driven." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2335d7ff'/%3E%3Ctext x='16' y='22' font-size='18' font-family='sans-serif' font-weight='800' text-anchor='middle' fill='%2303121c'%3EHI%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
<div id="app">

  <header class="topbar">
    <div class="shell">
      <div style="display:flex;align-items:center;gap:16px;">
        <a href="#/home" class="brand" aria-label="Hockey Intelligence home">
          <span class="mark">HI</span>
          <span class="word">Hockey<b>Intelligence</b>
            <span class="tag">The NHL universe</span>
          </span>
        </a>

        <div class="top-search" id="global-search">
          <div class="box">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg>
            <input id="search-input" type="text" placeholder="Search players, teams, franchises…" autocomplete="off" aria-label="Global search" />
            <kbd>/</kbd>
          </div>
          <div class="search-drop hidden" id="search-drop"></div>
        </div>

        <div class="top-icons" style="margin-left:auto;">
          <button class="icon-btn" id="btn-calendar" aria-label="Schedule" data-nav="#/schedule">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M8 3v4M16 3v4M3 10h18"></path></svg>
          </button>
          <button class="icon-btn" id="btn-bell" aria-label="Notifications">
            <span class="dot"></span>
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.7 21a2 2 0 0 1-3.4 0"></path></svg>
          </button>
          <button class="icon-btn" id="btn-star" aria-label="My favorites" data-nav="#/favorites">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m12 3 2.7 5.6 6.1.8-4.5 4.3 1.1 6-5.4-2.9-5.4 2.9 1.1-6L3.2 9.4l6.1-.8Z"></path></svg>
            <span class="badge hidden" id="fav-count"></span>
          </button>
          <button class="icon-btn" id="btn-account" aria-label="Account">
            <span class="avatar-ring" id="account-avatar">?</span>
          </button>
        </div>
      </div>

      <nav class="navrow" aria-label="Primary">
        <div class="nav-track" id="nav-track"></div>
      </nav>
    </div>
  </header>

  <main id="view" class="shell" tabindex="-1"></main>

  <footer class="footer shell">
    <span>Hockey Intelligence — open-source NHL intelligence platform. Stats are drawn from the embedded database; the AI analyst runs locally.</span>
    <span class="status-live"><span class="live-dot"></span><span id="footer-status">connecting</span></span>
  </footer>
</div>

<div class="modal-back hidden" id="modal-back">
  <div class="modal" id="modal-box" role="dialog" aria-modal="true"></div>
</div>

<div class="toast-wrap" id="toasts"></div>

<script src="/js/app.js"></script>
<script src="/js/pages/home.js"></script>
<script src="/js/pages/players.js"></script>
<script src="/js/pages/teams.js"></script>
<script src="/js/pages/standings.js"></script>
<script src="/js/pages/playoffs.js"></script>
<script src="/js/pages/compare.js"></script>
<script src="/js/pages/ai.js"></script>
<script src="/js/pages/misc.js"></script>
</body>
</html>
