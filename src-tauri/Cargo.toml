[package]
name = "hockey-intelligence"
version = "0.1.0"
description = "Hockey Intelligence — cinematic NHL data platform"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "hockey_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
strip = true
